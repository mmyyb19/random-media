<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>随机图片和文字弹窗</title>
    <style>
        .modal {
            display: none;
            position: fixed;
            z-index: 1;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            overflow: auto;
            background-color: rgba(0, 0, 0, 0.9);
        }
        .modal-content {
            background-color: #fefefe;
            margin: 15% auto;
            padding: 20px;
            border: 1px solid #888;
            width: 80%;
            max-width: 600px;
            text-align: center;
        }
        .close {
            color: #aaa;
            float: right;
            font-size: 28px;
            font-weight: bold;
        }
        .close:hover,
        .close:focus {
            color: black;
            text-decoration: none;
            cursor: pointer;
        }
        .image-container {
            position: relative;
            width: 100%;
        }
        .image-container img {
            width: 100%;
            height: auto;
        }
        .image-container .text {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: white;
            font-size: 24px;
            font-weight: bold;
        }
    </style>
</head>
<body>
    <div id="myModal" class="modal">
        <div class="modal-content">
            <span class="close">&times;</span>
            <div class="image-container">
                <img id="popupImage" src="" alt="Random Image">
                <div id="popupText" class="text"></div>
            </div>
            <button id="saveButton">保存到相册</button>
        </div>
    </div>

    <script>
        const githubUser = 'mmyyb19';
        const githubRepo = 'random-media';
        const githubBranch = 'images';
        const githubApiUrl = `https://api.github.com/repos/mmyyb19/random-media/images/main`;
        const githubTextsUrl = `https://api.github.com/repos/mmyyb19/random-media/contents/texts.txt`;

        // 获取图片列表
        async function getImages() {
            const response = await fetch(githubApiUrl);
            const data = await response.json();
            const treeUrl = data.commit.commit.tree.url;
            const treeResponse = await fetch(`${treeUrl}?recursive=1`);
            const treeData = await treeResponse.json();
            return treeData.tree.filter(item => item.path.startsWith('images/')).map(item => item.path);
        }

        // 获取文字内容
        async function getTexts() {
            const response = await fetch(githubTextsUrl);
            const data = await response.json();
            const content = atob(data.content); // 解码Base64
            return content.split('\n').filter(line => line.trim() !== '');
        }

        // 随机选择图片和文字
        function getRandomItem(array) {
            return array[Math.floor(Math.random() * array.length)];
        }

        // 显示弹窗
        async function showPopup() {
            const images = await getImages();
            const texts = await getTexts();
            const randomImage = getRandomItem(images);
            const randomText = getRandomItem(texts);

            const modal = document.getElementById('myModal');
            const popupImage = document.getElementById('popupImage');
            const popupText = document.getElementById('popupText');

            popupImage.src = `https://raw.githubusercontent.com/${githubUser}/${githubRepo}/${githubBranch}/${randomImage}`;
            popupText.textContent = randomText;

            modal.style.display = 'block';
        }

        // 保存图片到相册
        document.getElementById('saveButton').addEventListener('click', function() {
            const canvas = document.createElement('canvas');
            const ctx = canvas.getContext('2d');
            const img = new Image();
            img.src = document.getElementById('popupImage').src;
            img.onload = function() {
                canvas.width = img.width;
                canvas.height = img.height;
                ctx.drawImage(img, 0, 0);
                ctx.font = '24px Arial';
                ctx.fillStyle = 'white';
                ctx.textAlign = 'center';
                ctx.fillText(document.getElementById('popupText').textContent, canvas.width / 2, canvas.height / 2);
                canvas.toBlob(function(blob) {
                    const url = URL.createObjectURL(blob);
                    const a = document.createElement('a');
                    a.href = url;
                    a.download = 'combined-image.jpg';
                    a.click();
                    a.remove();
                }, 'image/jpeg');
            };
        });

        // 页面加载完成后显示弹窗
        window.onload = showPopup;

        // 关闭弹窗
        document.querySelector('.close').addEventListener('click', function() {
            document.getElementById('myModal').style.display = 'none';
        });
    </script>
</body>
</html>
